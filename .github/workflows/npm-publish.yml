name: Publish to npm

# Triggered when a GitHub Release is published. Workflow:
#   1. local:   npm --prefix . version patch -m "v%s", then push main + tag
#   2. github:  tag workflow creates a draft Release + packed tarball; publish it
#   3. here:    downloads the exact .tgz attached to that Release and
#               publishes it to npm with provenance. GitHub and npm thus
#               serve the same package bytes.
#
# Provenance requires `id-token: write` (GitHub OIDC) and npm CLI ≥ 9.5.
# It binds the published tarball to *this* commit + workflow run, so users
# can verify on npmjs.com that the bytes really came from this repo's CI.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose tarball should be published
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # No `npm install` — the draft-release workflow already packed the
      # package, and installing on this Linux runner would hit the package's
      # `"os": ["win32"]` runtime gate.
      - name: Download GitHub Release tarball and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern 'bakapiano-ccsm-*.tgz' \
            --dir dist
          mapfile -t assets < <(find dist -maxdepth 1 -type f -name 'bakapiano-ccsm-*.tgz')
          if [ "${#assets[@]}" -ne 1 ]; then
            echo "expected exactly one npm tarball asset, found ${#assets[@]}" >&2
            exit 1
          fi
          npm publish "${assets[0]}" --provenance --access public
